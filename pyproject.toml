[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py310"
exclude = ["vulture_whitelist.py", ".venv"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "I",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=guard_core --cov-branch --cov-report=term-missing"
markers = [
    "asyncio: mark tests as async",
]

[tool.coverage.report]
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = ["vulture_whitelist.py", ".venv"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "redis.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "guard_agent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "guard_agent.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "guard_core.sync.*"
disable_error_code = ["arg-type", "return-value", "assignment"]

[[tool.mypy.overrides]]
module = "datasets"
ignore_missing_imports = true

