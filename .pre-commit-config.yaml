repos:
-   repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        require_serial: true
        language: system
        types: [ python ]
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        require_serial: true
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy guard_core
        require_serial: true
        language: system
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture
        entry: uv run vulture vulture_whitelist.py
        require_serial: true
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -r guard_core -ll
        require_serial: true
        language: system
        types: [python]
        pass_filenames: false
      - id: radon-cc
        name: radon-cyclomatic-complexity
        entry: uv run radon cc guard_core -nc
        require_serial: true
        language: system
        types: [python]
        pass_filenames: false
      - id: xenon
        name: xenon
        entry: uv run xenon guard_core --max-absolute B --max-modules A --max-average A
        require_serial: true
        language: system
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: uv run deptry .
        require_serial: true
        language: system
        pass_filenames: false
      - id: pymarkdown
        name: pymarkdown
        entry: uv run pymarkdownlnt scan -r -e ".venv/**" -e ".git/**" -e ".github/**" -e "data/**" -e "guard_core/**" -e "tests/**" -e ".claude/**" -e "CLAUDE.md" -e ".cursor/**" -e ".kiro/**" -e "ZZZ/**" .
        require_serial: true
        language: system
        types: [markdown]
        pass_filenames: false
